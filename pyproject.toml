[project]
name = "agent-learning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==0.3.22",
    "agentscope>=2.0.11",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[azure,openai]>=0.7.5",
    "camel-ai>=0.2.90",
    "fastmcp>=4.1.5",
    "flask>=3.1.3",
    "gradio>=6.31.0",
    "hello-agents>=0.2.8",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "markitdown[all]>=0.1.9",
    "neo4j>=5.0.0",
    "numpy>=2.5.4",
    "openai>=1.37.0",
    "pandas-stubs>=3.1.0.261029",
    "python-dotenv>=1.2.4",
    "qdrant-client==1.12.1",
    "requests>=2.34.2",
    "serpapi>=1.1.2",
    "streamlit>=1.66.1",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]
[tool.uv]
override-dependencies = [
    { package = { name = "hello-agents", version = "0.2.8" }, dependencies = [
        "openai>=2.26.0",
    ] },
]
