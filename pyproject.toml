[project]
name = "agent-learning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agentscope>=2.0.11",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[azure,openai]>=0.7.5",
    "camel-ai>=0.2.90",
    "hello-agents>=0.2.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "openai>=1.37.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "serpapi>=1.1.2",
    "streamlit>=1.66.1",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]
[tool.uv]
override-dependencies = [
    { package = { name = "hello-agents", version = "0.2.8" }, dependencies = [
        "openai>=2.26.0",
    ] },
]
